[project]
name = "backing-track-extractor"
version = "0.1.0"
description = "Multi-platform backing track extraction service"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "pycryptodome>=3.20",
  "audio-separator[cpu]>=0.47",
  "audioread>=3.0",
  "imageio-ffmpeg>=0.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
